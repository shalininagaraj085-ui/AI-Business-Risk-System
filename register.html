<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Business Risk System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.1);

            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        .register-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 24px;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #dbeafe;

            text-decoration: none;
        }

        .home-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>🤖 Create Account</h1>

        <p class="subtitle">
            Register to use AI Business Risk Analysis
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >
            </div>


            <button
                type="submit"
                class="register-button"
            >
                Register
            </button>

        </form>


        <div id="message"></div>


        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const message =
                    document
                        .getElementById("message");


                // Password validation
                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match";

                    message.style.color =
                        "#ff6b6b";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name: name,
                                        email: email,
                                        password: password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Registration failed"
                        );

                    }


                    message.textContent =
                        "Registration successful!";

                    message.style.color =
                        "#4ade80";


                    document
                        .getElementById("registerForm")
                        .reset();


                    // Go to dashboard after registration
                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);


                } catch (error) {

                    console.error(
                        "Registration Error:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Registration failed";

                    message.style.color =
                        "#ff6b6b";

                }

            });

    </script>

</body>

</html>
